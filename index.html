<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPE — Contas por Empresa v19</title>

<!-- IDENTIFICAÇÃO DO SISTEMA (padrão RF Sistemas) -->
<meta name="rf-sistema" content="CPE">
<meta name="rf-sistema-nome" content="Contas por Empresa">
<meta name="rf-versao" content="v19">
<meta name="rf-data" content="2026-09-10">
<meta name="rf-cliente" content="Vinicius">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  /* CLARO — padrão */
  :root{
    --ouro:#C08A0C; --ouro-claro:#8a5a06; --preto:#f2f4f7; --carvao:#ffffff;
    --carta:#ffffff; --linha:#dbe0e6; --linha2:#eceff3; --fundo2:#f6f8fa;
    --campo:#ffffff; --btg:#eef1f4; --hover:#b9c1cb; --veu:rgba(20,24,28,.55);
    --texto:#171a1d; --fraco:#61686f;
    --verde:#227a44; --vermelho:#b23a24; --azul:#2c5c8f;
    --av-bg:#fdf6e3; --av-bd:#e6d3a3; --av-tx:#6b5310;
    --er-bg:#fdeeea; --er-bd:#f0c3b8; --er-tx:#8f2d1b;
    --ok-bg:#eaf7ee; --ok-bd:#bfe2c9; --ok-tx:#1c6136;
  }
  /* ESCURO */
  body[data-tema="escuro"]{
    --ouro:#D4A017; --ouro-claro:#E8C46A; --preto:#0b0b0b; --carvao:#121212;
    --carta:#171717; --linha:#262626; --linha2:#1e1e1e; --fundo2:#0d0d0d;
    --campo:#0e0e0e; --btg:#1f1f1f; --hover:#3a3a3a; --veu:rgba(0,0,0,.78);
    --texto:#ededed; --fraco:#9a9a9a;
    --verde:#3ea55f; --vermelho:#c8452f; --azul:#3a6ea5;
    --av-bg:#1a1408; --av-bd:#4a3a10; --av-tx:#e8d7a8;
    --er-bg:#1d0d0a; --er-bd:#55201a; --er-tx:#f0b6a8;
    --ok-bg:#0d1a0f; --ok-bd:#24461f; --ok-tx:#bfe6bf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--preto);color:var(--texto);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
  a{color:var(--ouro-claro)}
  .wrap{max-width:1280px;margin:0 auto;padding:0 14px 80px}

  header.top{background:var(--carvao);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:40}
  .topin{max-width:1280px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:9px}
  .marca b{font-size:16px;letter-spacing:.5px}
  .marca span{font-weight:300;letter-spacing:2px;font-size:11px;color:var(--fraco);display:block}
  .quem{margin-left:auto;text-align:right;font-size:12px;color:var(--fraco)}
  .quem b{color:var(--texto);display:block;font-size:13px}

  nav.abas{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0}
  nav.abas button{background:var(--carta);border:1px solid var(--linha);color:var(--fraco);
       padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px}
  nav.abas button.on{background:var(--ouro);border-color:var(--ouro);color:#fff;font-weight:700}
  nav.abas button .bad{background:var(--vermelho);color:#fff;border-radius:20px;padding:1px 7px;margin-left:6px;font-size:11px}

  .card{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:14px;letter-spacing:.4px;color:var(--ouro-claro)}

  .resumo{cursor:pointer;display:flex;align-items:center;gap:10px}
  .resumo .seta{color:var(--ouro);font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
  .kpi{background:var(--fundo2);border:1px solid var(--linha);border-radius:10px;padding:10px}
  .kpi small{display:block;color:var(--fraco);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .kpi b{font-size:19px;display:block;margin-top:3px}

  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .caixa{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:13px;cursor:pointer;
         transition:border-color .15s}
  .caixa:hover{border-color:var(--hover)}
  .caixa.aberta{grid-column:1/-1;cursor:default;border-color:var(--ouro);box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .caixa .cnpj{color:var(--fraco);font-size:11px;letter-spacing:.4px}
  .caixa .nome{font-weight:700;font-size:15px;margin:2px 0 8px}
  .barra{height:8px;background:var(--fundo2);border-radius:6px;overflow:hidden;border:1px solid var(--linha)}
  .barra i{display:block;height:100%;background:linear-gradient(90deg,#8a5a06,var(--ouro))}
  .miniln{display:flex;justify-content:space-between;font-size:12px;color:var(--fraco);margin-top:6px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--fundo2);color:var(--ouro-claro);text-align:left;padding:8px;font-size:11px;
     text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--linha)}
  td{padding:8px;border-bottom:1px solid var(--linha2);vertical-align:top}
  tr.pago td{opacity:.62}
  .tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;border:1px solid var(--linha)}
  .tag.e{color:var(--verde);border-color:var(--ok-bd);background:var(--ok-bg)}
  .tag.s{color:var(--vermelho);border-color:var(--er-bd);background:var(--er-bg)}

  button.bt{background:var(--ouro);border:none;color:#fff;font-weight:700;padding:8px 14px;
            border-radius:9px;cursor:pointer;font-size:13px}
  button.bt.g{background:var(--btg);color:var(--texto);border:1px solid var(--linha);font-weight:500}
  button.bt.mini{padding:4px 9px;font-size:12px}
  button.bt:disabled{opacity:.5;cursor:not-allowed}

  label{display:block;font-size:11px;color:var(--fraco);text-transform:uppercase;letter-spacing:.5px;margin:9px 0 4px}
  input,select,textarea{width:100%;background:var(--campo);border:1px solid var(--linha);color:var(--texto);
        padding:9px;border-radius:8px;font-size:14px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ouro)}
  .lin{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 12px}

  .modalbg{position:fixed;inset:0;background:var(--veu);z-index:60;display:flex;
           align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
  .modal{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:18px;
         width:100%;max-width:640px}
  .modal h2{margin:0 0 4px;font-size:17px;color:var(--ouro-claro)}

  .aviso{background:var(--av-bg);border:1px solid var(--av-bd);color:var(--av-tx);padding:9px 11px;border-radius:9px;font-size:12.5px;margin-bottom:10px}
  .erro{background:var(--er-bg);border:1px solid var(--er-bd);color:var(--er-tx);padding:9px 11px;border-radius:9px;font-size:12.5px;margin-bottom:10px}
  .ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok-tx);padding:9px 11px;border-radius:9px;font-size:12.5px;margin-bottom:10px}
  .vazio{color:var(--fraco);text-align:center;padding:26px;font-size:13px}

  footer.selo{position:fixed;bottom:0;left:0;right:0;background:var(--carvao);border-top:1px solid var(--linha);
        padding:5px 12px;font-size:11px;color:var(--fraco);display:flex;gap:10px;justify-content:center;z-index:30}
  footer.selo b{color:var(--ouro)}

  .login{max-width:380px;margin:9vh auto;text-align:center}
  .login .card{text-align:left}
  @media(max-width:600px){ .quem{width:100%;text-align:left;margin-left:0} th,td{padding:6px} }
</style>
</head>
<body>
<div id="app"></div>
<footer class="selo" id="selo"></footer>

<script>
/* ==========================================================================
   CPE — CONTAS POR EMPRESA
   Sistema..: CPE (RF Sistemas)
   Versão...: v6  ·  10/09/2026
   Cliente..: Vinicius
   ========================================================================== */
const SISTEMA = {
  codigo : 'CPE',
  nome   : 'Contas por Empresa',
  versao : 'v19',
  data   : '10/09/2026',
  cliente: 'Vinicius',
  casa   : 'RF Sistemas'
};

/* --------------------------------------------------------------------------
   CONFIGURAÇÃO — a ÚNICA coisa que precisa ser preenchida à mão.
   A chave está em: Supabase > Project Settings > API > anon public
   -------------------------------------------------------------------------- */
const CFG = {
  url : 'https://btbxqbozmrbbhjjpajbv.supabase.co',
  anon: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0YnhxYm96bXJiYmhqanBhamJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjA5NDksImV4cCI6MjEwNDUzNjk0OX0.SGX5jvB_xoxbv2nqRaEhbk1QDHsnEIVqTau5xyekVVo'
};

let sb = null;
const S = {
  user:null, perfil:null, empresasPermitidas:[],
  empresas:[], origens:[], movimentos:[], regras:[], perfis:[],
  tela:'painel', mes:mesHoje(), aberta:null, resumoAberto:false,
  msg:null, msgTipo:'ok', carregando:false, modal:null
};

/* ===================== utilidades ===================== */
function mesHoje(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function brl(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function dataBR(d){ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0] : d; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function soDig(t){ return String(t||'').replace(/\D/g,''); }
function mascaraCNPJ(t){ const d=soDig(t).slice(0,14);
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3')
          .replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2'); }
function validaCNPJ(t){
  const c=soDig(t); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const calc=(base,pesos)=>{ let s=0; for(let i=0;i<pesos.length;i++) s+=Number(base[i])*pesos[i];
    const r=s%11; return r<2?0:11-r; };
  const d1=calc(c,[5,4,3,2,9,8,7,6,5,4,3,2]);
  const d2=calc(c,[6,5,4,3,2,9,8,7,6,5,4,3,2]);
  return d1===Number(c[12]) && d2===Number(c[13]);
}
function norm(t){ return String(t||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function marcaSVG(px){
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 100 100" aria-hidden="true">'+
    '<rect width="100" height="100" rx="22" fill="#0b0b0b" stroke="#242424"/>'+
    '<rect x="22" y="60" width="14" height="20" rx="3" fill="#ffffff"/>'+
    '<rect x="43" y="45" width="14" height="35" rx="3" fill="#ffffff"/>'+
    '<rect x="64" y="26" width="14" height="54" rx="3" fill="#D4A017"/></svg>';
}
function aviso(txt,tipo){ S.msg=txt; S.msgTipo=tipo||'ok'; render(); if(txt) setTimeout(()=>{ if(S.msg===txt){S.msg=null;render();} },6000); }
function val(id){ const e=document.getElementById(id); return e? e.value : ''; }
function chk(id){ const e=document.getElementById(id); return e? e.checked : false; }

/* ===================== boot ===================== */
async function iniciar(){
  aplicarTema();
  document.getElementById('selo').innerHTML =
    '<span><b>'+SISTEMA.codigo+'</b> '+SISTEMA.versao+'</span><span>'+SISTEMA.nome+'</span><span>'+SISTEMA.casa+' · '+SISTEMA.data+'</span>';
  console.log('%c'+SISTEMA.codigo+' · '+SISTEMA.nome+' · '+SISTEMA.versao+' · '+SISTEMA.data+' · cliente: '+SISTEMA.cliente,
              'color:#D4A017;font-weight:bold');

  // a chave pode vir do arquivo OU ser colada na tela (fica guardada no aparelho)
  const guardada = (function(){ try{ return localStorage.getItem('cpe_anon')||''; }catch(e){ return ''; } })();
  if(guardada && guardada.length>40) CFG.anon = guardada;

  if(CFG.anon.indexOf('COLE_AQUI')===0){
    document.getElementById('app').innerHTML =
      '<div class="login"><div style="margin-bottom:14px">'+marcaSVG(64)+'</div>'+
      '<h2 style="margin:0 0 2px;letter-spacing:.5px">CONTAS POR EMPRESA</h2>'+
      '<div style="color:var(--fraco);font-size:12px;letter-spacing:2px;margin-bottom:18px">'+SISTEMA.casa.toUpperCase()+'</div>'+
      '<div class="card">'+
        '<h3 style="margin-top:0">Primeira vez neste aparelho</h3>'+
        '<div class="aviso">Cole a chave <b>anon public</b> do projeto. Ela fica guardada aqui e você não precisa fazer isso de novo.<br>'+
        'Supabase &gt; Project Settings &gt; API &gt; anon public</div>'+
        '<label>Chave anon public</label>'+
        '<textarea id="cfg-anon" rows="4" placeholder="eyJ..." style="font-size:12px"></textarea>'+
        '<div id="cfg-erro" style="color:#f0b6a8;font-size:12.5px;margin-top:6px"></div>'+
        '<div style="margin-top:14px"><button class="bt" style="width:100%" onclick="salvarChave()">Salvar e entrar</button></div>'+
      '</div>'+
      '<div style="color:var(--fraco);font-size:11px">'+SISTEMA.codigo+' '+SISTEMA.versao+'</div></div>';
    return;
  }
  sb = window.supabase.createClient(CFG.url, CFG.anon, { auth:{ persistSession:true, autoRefreshToken:true } });
  if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const { data } = await sb.auth.getSession();
  if(data && data.session){ S.user = data.session.user; await carregarTudo(); }
  render();
}

function salvarChave(){
  const k = (val('cfg-anon')||'').trim();
  const err = document.getElementById('cfg-erro');
  if(k.length < 30 || (k.indexOf('eyJ') !== 0 && k.indexOf('sb_publishable_') !== 0)){
    if(err) err.textContent = 'Isso não parece a chave pública (ela começa com eyJ ou sb_publishable_).';
    return;
  }
  if(k.indexOf('service_role') >= 0 || k.indexOf('sb_secret_') === 0){
    if(err) err.textContent = 'Essa é a service_role — nunca use ela aqui. Copie a anon public.';
    return;
  }
  try{ localStorage.setItem('cpe_anon', k); }catch(e){}
  location.reload();
}

async function entrar(){
  const email = val('lg-email').trim(), senha = val('lg-senha');
  if(!email || !senha) return aviso('Informe e-mail e senha.','erro');
  S.carregando = true; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password:senha });
  S.carregando = false;
  if(error) return aviso('Não entrou: '+error.message,'erro');
  S.user = data.user;
  await carregarTudo();
  render();
}
async function sair(){ await sb.auth.signOut(); S.user=null; S.perfil=null; S.movimentos=[]; S.empresas=[]; S.tela='painel'; render(); }

/* ===================== carga ===================== */
async function carregarTudo(){
  S.carregando = true; render();
  try{
    const { data:perfil } = await sb.from('perfis').select('*').eq('id', S.user.id).maybeSingle();
    S.perfil = perfil || null;
    if(!S.perfil){ aviso('Seu login existe, mas ainda não tem perfil no sistema. Peça ao administrador.','erro'); S.carregando=false; return; }
    if(S.perfil.ativo === false){ aviso('Seu acesso está desativado.','erro'); S.carregando=false; return; }

    const [emp, ori, mov, reg] = await Promise.all([
      sb.from('empresas').select('*').order('razao_social'),
      sb.from('origens').select('*').order('nome'),
      sb.from('movimentos').select('*').order('data_movimento',{ascending:false}).limit(4000),
      sb.from('regras_fornecedor').select('*')
    ]);
    S.empresas   = emp.data || [];
    S.origens    = ori.data || [];
    S.movimentos = mov.data || [];
    S.regras     = reg.data || [];
    if(podeUsuarios()){
      const { data:ps } = await sb.from('perfis').select('*').order('papel');
      S.perfis = ps || [];
    }
  }catch(e){ aviso('Erro ao carregar: '+e.message,'erro'); }
  S.carregando = false;
}

function papel(){ return S.perfil ? S.perfil.papel : null; }
function podeEditar(){ return ['mestre','dono','operador'].indexOf(papel())>=0; }
function podeUsuarios(){ return ['mestre','dono'].indexOf(papel())>=0; }
function podeApagar(){ return ['mestre','dono'].indexOf(papel())>=0; }

/* ===================== filtros ===================== */
function doMes(m){ return (m.data_movimento||'').slice(0,7) === S.mes; }
function movsDaEmpresa(id){ return S.movimentos.filter(m=>m.empresa_id===id && doMes(m)); }
function fila(){ return S.movimentos.filter(m=>!m.empresa_id); }
function totais(lista){
  let ent=0, sai=0, pago=0;
  lista.forEach(m=>{ const v=Number(m.valor)||0;
    if(m.tipo==='entrada') ent+=v; else { sai+=v; if(m.pago) pago+=v; } });
  return { ent, sai, pago, saldo:ent-sai, pct: sai>0 ? Math.min(100,Math.round(pago/sai*100)) : 0 };
}
function nomeEmpresa(id){ const e=S.empresas.find(x=>x.id===id); return e ? (e.apelido||e.razao_social) : '—'; }
function nomeOrigem(id){ const o=S.origens.find(x=>x.id===id); return o ? o.nome+(o.identificador?' ·'+o.identificador:'') : '—'; }

/* ===================== render ===================== */
function render(){
  const app = document.getElementById('app');
  if(!S.user){ app.innerHTML = telaLogin(); return; }

  let corpo = '';
  if(S.carregando && !S.empresas.length) corpo = '<div class="vazio">Carregando…</div>';
  else if(S.tela==='painel')   corpo = telaPainel();
  else if(S.tela==='fila')     corpo = telaFila();
  else if(S.tela==='origens')  corpo = telaOrigens();
  else if(S.tela==='empresas') corpo = telaEmpresas();
  else if(S.tela==='usuarios') corpo = telaUsuarios();

  const nf = fila().length;
  app.innerHTML =
    '<header class="top"><div class="topin">'+
      '<div class="marca">'+marcaSVG(34)+'<div><b>CONTAS POR EMPRESA</b><span>'+SISTEMA.casa.toUpperCase()+'</span></div></div>'+
      '<button class="bt g mini" style="margin-left:auto" onclick="trocarTema()" title="Claro / escuro">'+(temaAtual()==='escuro'?'☀ claro':'🌙 escuro')+'</button>'+
      '<div class="quem" style="margin-left:12px"><b>'+esc(S.perfil? (S.perfil.nome||S.perfil.email) : '')+'</b>'+
        esc(papel()||'')+' · <a href="#" onclick="sair();return false">sair</a></div>'+
    '</div></header>'+
    '<div class="wrap">'+
      '<nav class="abas">'+
        aba('painel','Painel')+
        aba('fila','Apontar depois'+(nf?'<span class="bad">'+nf+'</span>':''))+
        aba('origens','Cartões e contas')+
        aba('empresas','Empresas')+
        (podeUsuarios()? aba('usuarios','Usuários') : '')+
      '</nav>'+
      (S.msg? '<div class="'+S.msgTipo+'">'+esc(S.msg)+'</div>' : '')+
      corpo+
    '</div>'+
    (S.modal || '');
}
function temaAtual(){ try{ return localStorage.getItem('cpe_tema')||'claro'; }catch(e){ return 'claro'; } }
function aplicarTema(){ document.body.setAttribute('data-tema', temaAtual()); }
function trocarTema(){ const novo = temaAtual()==='escuro'?'claro':'escuro';
  try{ localStorage.setItem('cpe_tema',novo); }catch(e){} aplicarTema(); render(); }

function aba(id,rot){ return '<button class="'+(S.tela===id?'on':'')+'" onclick="irPara(\''+id+'\')">'+rot+'</button>'; }
function irPara(t){ S.tela=t; S.msg=null; render(); }

function telaLogin(){
  return '<div class="login">'+
    '<div style="margin-bottom:14px">'+marcaSVG(64)+'</div>'+
    '<h2 style="margin:0 0 2px;letter-spacing:.5px">CONTAS POR EMPRESA</h2>'+
    '<div style="color:var(--fraco);font-size:12px;letter-spacing:2px;margin-bottom:18px">'+SISTEMA.casa.toUpperCase()+'</div>'+
    (S.msg? '<div class="'+S.msgTipo+'">'+esc(S.msg)+'</div>' : '')+
    '<div class="card">'+
      '<label>E-mail</label><input id="lg-email" type="email" autocomplete="username">'+
      '<label>Senha</label><input id="lg-senha" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')entrar()">'+
      '<div style="margin-top:14px"><button class="bt" style="width:100%" onclick="entrar()" '+(S.carregando?'disabled':'')+'>'+
        (S.carregando?'Entrando…':'Entrar')+'</button></div>'+

function sugerirEmpresa(m){
  const cnpj = soDig(m.cnpj_fornecedor);
  let r = cnpj ? S.regras.find(x=>x.tipo_chave==='cnpj' && soDig(x.chave)===cnpj) : null;
  if(!r && m.fornecedor) r = S.regras.find(x=>x.tipo_chave==='nome' && norm(x.chave)===norm(m.fornecedor));
  if(!r && m.origem_id)  r = S.regras.find(x=>x.tipo_chave==='origem' && x.chave===m.origem_id);
  return r ? r.empresa_id : null;
}
async function apontar(id){
  const empresa = val('fila-'+id);
  if(!empresa) return aviso('Escolha a empresa.','erro');
  const m = S.movimentos.find(x=>x.id===id);
  const { error } = await sb.from('movimentos').update({ empresa_id:empresa }).eq('id',id);
  if(error) return aviso('Não gravou: '+error.message,'erro');
  m.empresa_id = empresa;

  if(chk('regra-'+id)){
    const chave = soDig(m.cnpj_fornecedor) || m.fornecedor || m.origem_id;
    const tipo  = soDig(m.cnpj_fornecedor) ? 'cnpj' : (m.fornecedor ? 'nome' : 'origem');
    if(chave){
      const { error:e2 } = await sb.from('regras_fornecedor')
        .upsert({ chave:String(chave), tipo_chave:tipo, empresa_id:empresa, criado_por:S.user.id },
                { onConflict:'tipo_chave,chave' });
      if(!e2){ const { data } = await sb.from('regras_fornecedor').select('*'); S.regras = data||S.regras; }
    }
  }
  aviso('Apontado para '+nomeEmpresa(empresa)+'.','ok');
}

function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function editarMov(id){ const m = S.movimentos.find(x=>x.id===id); if(m) abrirLancamento(m.tipo, m); }

async function salvarMovimento(){
  const tipo = val('mv-tipo');
  const empresa = val('mv-empresa') || null;
  const valor = Number(val('mv-valor'));
  if(!valor || valor<=0) return aviso('Informe o valor.','erro');
  if(tipo==='entrada' && !empresa) return aviso('Entrada exige a empresa — é a regra do sistema.','erro');
  const cnpj = soDig(val('mv-cnpj'));
  if(cnpj && cnpj.length===14 && !validaCNPJ(cnpj)) return aviso('CNPJ do documento inválido.','erro');

  const reg = {
    tipo, empresa_id:empresa, origem_id: val('mv-origem')||null,
    valor, data_movimento: val('mv-data')||hojeISO(),
    fornecedor: val('mv-forn')||null, cnpj_fornecedor: cnpj||null,
    categoria: val('mv-cat')||null, descricao: val('mv-desc')||null,
    pago: tipo==='saida' ? chk('mv-pago') : true,
    criado_por: S.user.id
  };
  if(reg.pago && tipo==='saida') reg.data_pagamento = reg.data_movimento;
  if(_arquivoPendente){ const up = await subirAnexo(_arquivoPendente);
    if(up){ reg.anexo_path = up.path; reg.anexo_nome = up.nome; reg.lido_por_ia = _lidoPorIA; } }

  // se a saída ficou solta mas há regra para o fornecedor, aponta sozinho
  if(tipo==='saida' && !empresa){
    const sug = sugerirEmpresa(reg);
    if(sug){ reg.empresa_id = sug; }
  }

  let res;
  if(_edit) res = await sb.from('movimentos').update(reg).eq('id',_edit.id).select().maybeSingle();
  else      res = await sb.from('movimentos').insert(reg).select().maybeSingle();
  if(res.error) return aviso('Não gravou: '+res.error.message,'erro');

  if(_edit){ const i = S.movimentos.findIndex(x=>x.id===_edit.id); if(i>=0) S.movimentos[i]=res.data; }
  else S.movimentos.unshift(res.data);
  _edit=null; _arquivoPendente=null; _lidoPorIA=false;
  S.modal=null;
  aviso(reg.empresa_id ? 'Movimento gravado.' : 'Gravado sem empresa — está na fila "Apontar depois".','ok');
}

async function alternarPago(id){
  const m = S.movimentos.find(x=>x.id===id); if(!m) return;
  const novo = !m.pago;
  const { error } = await sb.from('movimentos')
    .update({ pago:novo, data_pagamento: novo? hojeISO() : null }).eq('id',id);
  if(error) return aviso('Não gravou: '+error.message,'erro');
  m.pago=novo; m.data_pagamento = novo? hojeISO() : null; render();
}
async function excluirMov(id){
  if(!confirm('Excluir este movimento?')) return;
  const { error } = await sb.from('movimentos').delete().eq('id',id);
  if(error) return aviso('Não excluiu: '+error.message,'erro');
  S.movimentos = S.movimentos.filter(x=>x.id!==id);
  aviso('Excluído.','ok');
}

/* --- leitura do documento --- */
let _arquivoPendente = null, _lidoPorIA = false;
function statusLeitura(t){ const e=document.getElementById('mv-leitura'); if(e) e.innerHTML=t; }

async function lerDocumento(){
  const inp = document.getElementById('mv-arq');
  const f = inp && inp.files && inp.files[0];
  if(!f) return;
  _arquivoPendente = f; _lidoPorIA = false;
  statusLeitura('Lendo o documento…');
  try{
    let dados = null;
    if(f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
      const texto = await textoDoPDF(f, 30);
      // extrato não é nota: tem vários lançamentos e não cabe num lançamento só
      const linhasExtrato = extratoLinhas(texto||'');
      const cheiroDeExtrato = /extrato|lan[çc]amentos?\s+valor|saldo\s+anterior|saldo\s+em\s+\d{2}\/|per[ií]odo de\s+\d{2}\//i.test(texto||'');
      if(linhasExtrato.length >= 3 || (cheiroDeExtrato && linhasExtrato.length >= 1)){
        _arquivoPendente = null;
        const e = document.getElementById('mv-arq'); if(e) e.value = '';
        statusLeitura('<b>Isso é um extrato</b> ('+linhasExtrato.length+' lançamentos) — não cabe num lançamento só.<br>'+
          '<button class="bt mini" style="margin-top:8px" onclick="fecharModal();irPara(\'origens\');abrirExtrato()">Abrir a importação de extrato</button>');
        return;
      }
      if(texto && texto.replace(/\s/g,'').length > 40){ dados = extrairDoTexto(texto); statusLeitura('Lido do PDF (sem custo de IA).'); }
    }
    if(!dados){
      statusLeitura('Sem texto no arquivo — mandando para a leitura por IA…');
      dados = await lerPorIA(f); _lidoPorIA = true;
      statusLeitura(dados ? 'Lido por IA.' : 'A IA não conseguiu ler. Preencha à mão.');
    }
    if(dados) aplicarLeitura(dados);
  }catch(e){ statusLeitura('Não deu para ler: '+e.message+'. Preencha à mão — o arquivo continua anexado.'); }
}

async function linhasDoPDF(file, maxPag){
  if(!window.pdfjsLib) return [];
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data:buf }).promise;
  const linhas = [];
  const n = Math.min(pdf.numPages, maxPag || 3);
  for(let i=1;i<=n;i++){
    const pg = await pdf.getPage(i);
    const c = await pg.getTextContent();
    // agrupa os pedaços por altura (y) — remonta a linha como ela aparece na página
    const grupos = [];
    c.items.forEach(it=>{
      const x = it.transform[4], y = Math.round(it.transform[5]);
      let g = grupos.find(gg=>Math.abs(gg.y - y) <= 3);
      if(!g){ g = { y, partes:[] }; grupos.push(g); }
      g.partes.push({ x, str: it.str });
    });
    grupos.sort((a,b)=> b.y - a.y);                       // no PDF o y cresce para cima
    grupos.forEach(g=>{
      g.partes.sort((a,b)=> a.x - b.x);
      const txt = g.partes.map(p=>p.str).join(' ').replace(/\s+/g,' ').trim();
      if(txt) linhas.push(txt);
    });
  }
  return linhas;
}

async function textoDoPDF(file, maxPag){
  const linhas = await linhasDoPDF(file, maxPag);
  return linhas.join('\n');
}

function extrairDoTexto(t){
  const d = {};
  const mc = t.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g);
  if(mc){ const bom = mc.find(x=>validaCNPJ(x)); if(bom) d.cnpj = soDig(bom); }
  const mv = t.match(/(?:VALOR\s*(?:TOTAL|A\s*PAGAR|DO\s*DOCUMENTO)?|TOTAL\s*(?:GERAL|A\s*PAGAR)?)\D{0,18}(\d{1,3}(?:\.\d{3})*,\d{2})/i);
  if(mv) d.valor = Number(mv[1].replace(/\./g,'').replace(',','.'));
  else { const todos = t.match(/\d{1,3}(?:\.\d{3})*,\d{2}/g);
         if(todos) d.valor = Math.max.apply(null, todos.map(v=>Number(v.replace(/\./g,'').replace(',','.')))); }
  const md = t.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(md) d.data = md[3]+'-'+md[2]+'-'+md[1];
  const linhas = t.split(/\s{2,}|\n/).map(s=>s.trim()).filter(s=>s.length>6);
  const ln = linhas.find(s=>/LTDA|ME$|EIRELI|S\/A|S\.A|COMERCIO|SERVICOS|SUPERMERC|POSTO|DISTRIBUID/i.test(s));
  if(ln) d.fornecedor = ln.slice(0,80);
  return (d.cnpj||d.valor) ? d : null;
}
async function fileParaBase64(file){
  const buf = await file.arrayBuffer();           // materializa (o File do Android não streama)
  const bytes = new Uint8Array(buf);
  if(!bytes.length) throw new Error('o arquivo veio vazio do seletor — tente escolher pela Galeria, ou copie a foto para o armazenamento interno');
  let bin = '', chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return { b64: btoa(bin), kb: Math.round(bytes.length/1024) };
}

async function lerPorIA(file){
  const { b64, kb } = await fileParaBase64(file);
  statusLeitura('Arquivo lido ('+kb+' KB). Mandando para a leitura…');
  const mime = file.type || 'image/jpeg';
  // tenta um nome de campo por vez (uma cópia só da imagem por chamada)
  const chaves = ['arquivoBase64'];   // confirmado no código da ler-nota (linha 80)
  let ultimoErro = '';
  for(const chave of chaves){
    const corpo = { mimeType: mime, mime_type: mime, tipo: 'nota', nome: file.name };
    corpo[chave] = b64;
    const { data, error } = await sb.functions.invoke('ler-nota', { body: corpo });
    if(!error){
      const lido = normalizarLeitura(data);
      if(lido) return lido;
      ultimoErro = 'a função respondeu, mas sem os campos da nota';
      continue;
    }
    let msg = error.message || String(error);
    try{ const j = await error.context.json(); if(j && (j.erro||j.error)) msg = j.erro||j.error; }
    catch(e){ try{ const t = await error.context.text(); if(t) msg = t.slice(0,200); }catch(e2){} }
    ultimoErro = msg;
    if(!/vazio|empty|obrigat|required|inform|missing|faltando/i.test(msg)) break; // erro que não é de campo: para
  }
  throw new Error(ultimoErro || 'a função não respondeu');
}

/* aceita qualquer formato de resposta da Edge Function: procura as chaves no JSON */
function lerLinhaPipe(txt){
  const t = String(txt||'').trim();
  if(!t || /^ERRO$/i.test(t) || t.indexOf('|') < 0) return null;
  const p = t.split('|').map(x=>x.trim());
  const d = {};
  if(soDig(p[0]).length === 14) d.cnpjPagador = soDig(p[0]);
  if(p[1]) d.fornecedor = p[1].slice(0,80);
  if(p[2]){ const n = Number(p[2].replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.')); if(n>0) d.valor = n; }
  if(p[3] && /^\d{4}-\d{2}-\d{2}$/.test(p[3])) d.data = p[3];
  if(p[4]) d.descricao = 'Documento nº '+p[4];
  return Object.keys(d).length ? d : null;
}

function normalizarLeitura(obj){
  if(!obj) return null;
  if(typeof obj === 'string'){
    const pipe = lerLinhaPipe(obj);
    if(pipe) return pipe;
    try{ obj = JSON.parse(obj); }catch(e){ return null; }
  }
  // a ler-nota pode devolver a linha em pipe dentro de algum campo
  if(typeof obj === 'object'){
    for(const k of Object.keys(obj)){
      if(typeof obj[k] === 'string' && obj[k].split('|').length >= 4){
        const pipe = lerLinhaPipe(obj[k]);
        if(pipe) return pipe;
      }
    }
  }
  const achado = {};
  (function cavar(o,nivel){
    if(!o || typeof o!=='object' || nivel>4) return;
    Object.keys(o).forEach(k=>{
      const v = o[k], kn = norm(k);
      if(v && typeof v==='object') return cavar(v,nivel+1);
      if(v==null || v==='') return;
      if(!achado.cnpj && /CNPJ/.test(kn) && soDig(v).length>=14) achado.cnpj = soDig(v).slice(0,14);
      else if(!achado.valor && /(VALOR|TOTAL)/.test(kn)){
        const n = typeof v==='number'? v : Number(String(v).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'));
        if(n>0) achado.valor = n;
      }
      else if(!achado.data && /(DATA|EMISSAO|VENCIMENTO)/.test(kn)){
        const s = String(v); const br = s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        achado.data = br ? br[3]+'-'+br[2]+'-'+br[1] : (/^\d{4}-\d{2}-\d{2}/.test(s)? s.slice(0,10) : null);
      }
      else if(!achado.fornecedor && /(FORNECEDOR|EMITENTE|RAZAO|NOME|LOJA|ESTABELEC)/.test(kn)) achado.fornecedor = String(v).slice(0,80);
      else if(!achado.descricao && /(DESCRICAO|ITENS|HISTORICO)/.test(kn)) achado.descricao = String(v).slice(0,120);
    });
  })(obj,0);
  return Object.keys(achado).length ? achado : null;
}
function aplicarLeitura(d){
  const set=(id,v)=>{ const e=document.getElementById(id); if(e && v!=null && v!=='') e.value=v; };
  if(d.valor) set('mv-valor', Number(d.valor).toFixed(2));
  if(d.data)  set('mv-data', d.data);
  if(d.cnpj)  set('mv-cnpj', mascaraCNPJ(d.cnpj));
  // cnpjPagador = quem paga a conta, ou seja, a EMPRESA (não o fornecedor)
  if(d.cnpjPagador){
    const emp = S.empresas.find(x=>soDig(x.cnpj)===soDig(d.cnpjPagador));
    const sel = document.getElementById('mv-empresa');
    if(emp && sel){ sel.value = emp.id;
      statusLeitura('Lido · a conta é da empresa '+esc(emp.apelido||emp.razao_social)+'.'); }
    else { statusLeitura('Lido · o CNPJ pagador ('+mascaraCNPJ(d.cnpjPagador)+') não é de nenhuma empresa cadastrada — vai para a fila.'); }
  }
  if(d.fornecedor) set('mv-forn', d.fornecedor);
  if(d.descricao)  set('mv-desc', d.descricao);
  // se o CNPJ do documento for de uma das empresas, já aponta
  if(d.cnpj){
    const e = S.empresas.find(x=>soDig(x.cnpj)===soDig(d.cnpj));
    if(e){ const sel=document.getElementById('mv-empresa'); if(sel) sel.value=e.id;
           statusLeitura('Lido · CNPJ é da empresa '+esc(e.apelido||e.razao_social)+'.'); return; }
    const r = S.regras.find(x=>x.tipo_chave==='cnpj' && soDig(x.chave)===soDig(d.cnpj));
    if(r){ const sel=document.getElementById('mv-empresa'); if(sel) sel.value=r.empresa_id;
           statusLeitura('Lido · empresa preenchida por regra gravada.'); }
  }
}

function empresaDoTexto(t){
  const achados = (t.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g)||[]).map(soDig).filter(validaCNPJ);
  if(!achados.length) return null;
  const cnpj = achados[0];
  // corta no próximo rótulo, porque o pdf.js junta tudo numa linha só
  const cortar = (txt)=> String(txt||'')
      .split(/\s*(?:Nome\s*Fantasia|CPF\s*\/?\s*CNPJ|CNPJ|Inscri[cç][aã]o|Endere[cç]o|Email|E-mail|Fone|Simples\s*Nacional|Incentivador)\b/i)[0]
      .replace(/\s{2,}/g,' ').trim().slice(0,90);
  let razao = '';
  const m = t.match(/Raz[aã]o\s*Social[:\s]*(.{5,150})/i);
  if(m) razao = cortar(m[1]);
  if(!razao){
    const ln = t.split(/\s{2,}|\n/).map(x=>x.trim()).find(x=>/LTDA|EIRELI|S\/A|S\.A|ME$/i.test(x) && x.length>6);
    if(ln) razao = ln.slice(0,90);
  }
  let fantasia = '';
  const mf = t.match(/Nome\s*Fantasia[:\s]*(.{3,120})/i);
  if(mf) fantasia = cortar(mf[1]);
  return { cnpj, razao, fantasia };
}

function extratoCabecalho(t){
  const plano = String(t||'').replace(/\s+/g,' ');
  const banco = (plano.match(/\b(UNICRED|BRADESCO|ITA[UÚ]|SANTANDER|BANCO DO BRASIL|CAIXA|NUBANK|INTER|SICOOB|SICREDI|C6|BTG|SAFRA)\b/i)||[])[1] || '';
  const conta = (plano.match(/Conta:?\s*([\d.-]+)/i)||[])[1] || '';
  const tit   = (plano.match(/Solicitado por\s+([A-ZÀ-Ÿ][^-*]{3,60})/i)||[])[1] || '';
  return { banco: banco ? banco.charAt(0)+banco.slice(1).toLowerCase() : '', conta, titular:(tit||'').trim() };
}

function extratoLinhas(t){
  const bruto = String(t||'');
  const porLinha = extratoPorLinha(bruto.split(/\n/));
  if(porLinha.length) return porLinha;
  return extratoCorrido(bruto);           // reserva: texto sem quebra de linha
}

function extratoValor(v){ return Number(String(v).replace(/\./g,'').replace(',','.')); }
function extratoLimpa(d){
  return String(d||'').replace(/\s+/g,' ')
    .replace(/CENTRAL DE RELACIONAMENTO[^]*$/i,'')
    .replace(/0800[^]*$/i,'')
    .replace(/Saldo no final[^]*$/i,'')
    .replace(/P[áa]g\.?\s*\d+\s*\/?\s*\d*/gi,'').trim();
}
function extratoValido(desc){
  if(extratoLimpa(desc).replace(/[^A-Za-zÀ-ÿ]/g,'').length < 4) return false;
  return !/Extrato|Per[ií]odo|Solicitado|Saldo em|Saldo atual|Total Dispon|Limite de/i.test(desc);
}

function extratoPorLinha(linhas){
  // montagem por estado: a data abre o lançamento, o valor pode vir em outra
  // linha (o pdf.js centraliza o valor quando a descrição ocupa 2 linhas)
  const out = [];
  let atual = null;
  const reData  = /^(\d{2}\/\d{2}\/\d{4})\b/;
  const reMoeda = /(-\s*)?R\$\s*([\d.]+,\d{2})/g;

  function fechar(){
    if(atual && atual.valor){
      const desc = extratoLimpa(atual.desc);
      if(extratoValido(desc)){
        out.push({ data:atual.data, descricao:desc.slice(0,140),
                   contraparte:((desc.match(/\/\s*([^)]{3,80})\)/)||[])[1]||'').trim(),
                   valor:atual.valor, tipo:atual.tipo });
      }
    }
    atual = null;
  }

  linhas.forEach(ln=>{
    const l = String(ln||'').replace(/\s+/g,' ').trim();
    if(!l) return;
    if(/CENTRAL DE RELACIONAMENTO|OUVIDORIA|^P[áa]g\.|Valor\s*\(R\$\)/i.test(l)) return;

    reMoeda.lastIndex = 0;
    const moedas = [];
    let mm;
    while((mm = reMoeda.exec(l)) !== null) moedas.push({ neg: !!mm[1], v: extratoValor(mm[2]) });
    const semMoeda = l.replace(/(-\s*)?R\$\s*[\d.]+,\d{2}/g, ' ').replace(/\s+/g,' ').trim();
    const md = l.match(reData);

    if(md){                                   // linha nova de lançamento
      fechar();
      const p = md[1].split('/');
      atual = { data:p[2]+'-'+p[1]+'-'+p[0], desc: semMoeda.replace(reData,'').trim(), valor:null, tipo:'saida' };
      if(moedas.length){ atual.valor = moedas[0].v; atual.tipo = moedas[0].neg ? 'saida' : 'entrada'; }
      return;
    }
    if(!atual) return;
    if(moedas.length && !atual.valor){         // o valor veio numa linha só dele
      atual.valor = moedas[0].v;
      atual.tipo  = moedas[0].neg ? 'saida' : 'entrada';
      if(semMoeda) atual.desc = (atual.desc+' '+semMoeda).trim();
      return;
    }
    if(!moedas.length && /[A-Za-zÀ-ÿ]/.test(semMoeda)){   // continuação da descrição
      atual.desc = (atual.desc+' '+semMoeda).trim();
    }
  });
  fechar();
  return out;
}

function extratoCorrido(t){
  let plano = String(t||'').replace(/\s+/g,' ');
  const ini = plano.search(/Data\s+Lan[çc]amentos/i);
  if(ini > 0) plano = plano.slice(ini);
  plano = plano.replace(/CENTRAL DE RELACIONAMENTO[^]*?OUVIDORIA:?\s*\d+/gi,' ');
  const out = [];
  const re = /(\d{2}\/\d{2}\/\d{4})\s+(.*?)\s*(-\s*)?R\$\s*([\d.]+,\d{2})\s+(-\s*)?R\$\s*([\d.]+,\d{2})\s*([^]*?)(?=\d{2}\/\d{2}\/\d{4}\s|$)/g;
  let m;
  while((m = re.exec(plano)) !== null){
    const desc = extratoLimpa((m[2]||'')+' '+(m[7]||''));
    const valor = extratoValor(m[4]);
    if(!valor || !extratoValido(desc)) continue;
    const p = m[1].split('/');
    out.push({ data:p[2]+'-'+p[1]+'-'+p[0], descricao:desc.slice(0,140),
               contraparte:((desc.match(/\/\s*([^)]{3,80})\)/)||[])[1]||'').trim(),
               valor, tipo: m[3] ? 'saida' : 'entrada' });
  }
  return out;
}

async function lerExtrato(){
  const inp = document.getElementById('ex-arq');
  const f = inp && inp.files && inp.files[0];
  if(!f) return;
  statusExtrato('Lendo o extrato…');
  try{
    const texto = await textoDoPDF(f, 30);
    if(!texto || texto.replace(/\s/g,'').length < 60)
      return statusExtrato('<span style="color:var(--vermelho)">Esse PDF não tem texto (deve ser escaneado). Peça o extrato em PDF direto do banco.</span>');
    const cab = extratoCabecalho(texto);
    const linhas = extratoLinhas(texto);
    if(!linhas.length){
      const amostra = texto.split(/\n/).filter(x=>x.trim()).slice(3,9).join(' ⏎ ').slice(0,400);
      return statusExtrato('<span style="color:var(--vermelho)">Não reconheci nenhum lançamento nesse arquivo.</span>'+
        '<div style="margin-top:8px;font-size:11.5px;color:var(--fraco)"><b>O que eu li:</b><br>'+esc(amostra)+'</div>');
    }

    // já lançados antes (mesma data + valor + descrição)
    const jaTem = new Set(S.movimentos.map(m=>m.data_movimento+'|'+Number(m.valor).toFixed(2)+'|'+(m.descricao||'').slice(0,60)));
    linhas.forEach(l=>{ l.repetido = jaTem.has(l.data+'|'+l.valor.toFixed(2)+'|'+l.descricao.slice(0,60)); });

    _extrato = { cab, linhas };
    const ent = linhas.filter(x=>x.tipo==='entrada'), sai = linhas.filter(x=>x.tipo==='saida');
    const rep = linhas.filter(x=>x.repetido).length;
    const nomeSug = [cab.banco, cab.conta].filter(Boolean).join(' · ') || (cab.titular||'Conta');

    statusExtrato('Lido do PDF, sem custo de IA.');
    document.getElementById('ex-corpo').innerHTML =
      '<div class="kpis" style="margin:12px 0">'+
        kpi('Lançamentos', linhas.length)+
        kpi('Entradas', ent.length+' · '+brl(ent.reduce((s,x)=>s+x.valor,0)))+
        kpi('Saídas', sai.length+' · '+brl(sai.reduce((s,x)=>s+x.valor,0)))+
        (rep? kpi('Já lançados', rep+' (serão pulados)') : '')+
      '</div>'+
      '<label>Origem (cartão / conta)</label>'+
      '<select id="ex-origem"><option value="">— criar nova: '+esc(nomeSug)+' —</option>'+
        S.origens.map(o=>'<option value="'+o.id+'">'+esc(o.nome)+(o.identificador?' ·'+esc(o.identificador):'')+'</option>').join('')+
      '</select>'+
      (cab.titular? '<div style="color:var(--fraco);font-size:12px;margin-top:4px">titular no extrato: '+esc(cab.titular)+'</div>':'')+
      (ent.length? '<label>Empresa das ENTRADAS (obrigatória — é a regra do sistema)</label>'+
        '<select id="ex-empresa"><option value="">— não importar as entradas —</option>'+
          S.empresas.map(e=>'<option value="'+e.id+'">'+esc(e.apelido||e.razao_social)+'</option>').join('')+
        '</select>' : '')+
      '<div style="margin-top:14px"><button class="bt" onclick="importarExtrato()">Importar '+linhas.filter(x=>!x.repetido).length+' lançamentos</button></div>'+
      '<div style="max-height:220px;overflow:auto;border:1px solid var(--linha);border-radius:8px;margin-top:12px">'+
      '<table><thead><tr><th>Data</th><th>Descrição</th><th style="text-align:right">Valor</th></tr></thead><tbody>'+
        linhas.slice(0,60).map(l=>'<tr'+(l.repetido?' style="opacity:.45"':'')+'>'+
          '<td style="white-space:nowrap">'+dataBR(l.data)+'</td>'+
          '<td>'+esc(l.contraparte||l.descricao.slice(0,60))+(l.repetido?' <span class="tag">já lançado</span>':'')+'</td>'+
          '<td style="text-align:right;white-space:nowrap;color:'+(l.tipo==='entrada'?'var(--verde)':'var(--vermelho)')+'">'+
            (l.tipo==='entrada'?'+':'−')+brl(l.valor).replace('R$','')+'</td></tr>').join('')+
      '</tbody></table></div>'+
      (linhas.length>60? '<div style="color:var(--fraco);font-size:12px;margin-top:6px">mostrando os 60 primeiros de '+linhas.length+'</div>':'');
  }catch(e){ statusExtrato('<span style="color:var(--vermelho)">Não deu para ler: '+esc(e.message)+'</span>'); }
}

async function importarExtrato(){
  if(!_extrato) return;
  const empresaEnt = val('ex-empresa') || null;
  let origemId = val('ex-origem') || null;

  if(!origemId){
    const cab = _extrato.cab;
    const nome = [cab.banco, cab.titular].filter(Boolean).join(' — ') || 'Conta importada';
    const { data, error } = await sb.from('origens')
      .insert({ nome, tipo:'conta', identificador: cab.conta||null, titular: cab.titular||null })
      .select().maybeSingle();
    if(error) return aviso('Não criou a origem: '+error.message,'erro');
    S.origens.push(data); origemId = data.id;
  }

  const novos = _extrato.linhas.filter(l=>!l.repetido)
    .filter(l=> l.tipo==='saida' || empresaEnt )
    .map(l=>{
      const base = { tipo:l.tipo, origem_id:origemId, valor:l.valor, data_movimento:l.data,
                     descricao:l.descricao, fornecedor:l.contraparte||null,
                     pago:true, data_pagamento:l.data, criado_por:S.user.id };
      if(l.tipo==='entrada') base.empresa_id = empresaEnt;
      else {
        const sug = sugerirEmpresa({ fornecedor:l.contraparte, origem_id:origemId });
        if(sug) base.empresa_id = sug;
      }
      return base;
    });

  if(!novos.length) return aviso('Nada novo para importar.','ok');

  statusExtrato('Gravando '+novos.length+' lançamentos…');
  let gravados = 0;
  for(let i=0; i<novos.length; i+=100){
    const lote = novos.slice(i, i+100);
    const { data, error } = await sb.from('movimentos').insert(lote).select();
    if(error){ aviso('Parou no lançamento '+(i+1)+': '+error.message,'erro'); break; }
    (data||[]).forEach(m=>S.movimentos.unshift(m));
    gravados += (data||[]).length;
    statusExtrato('Gravando… '+gravados+' de '+novos.length);
  }
  _extrato = null; S.modal = null;
  aviso(gravados+' lançamentos importados. As saídas sem empresa estão em "Apontar depois".','ok');
}

  abrirModal('<h2>'+(o?'Editar origem':'Nova origem')+'</h2>'+
    '<input type="hidden" id="or-id" value="'+(o?o.id:'')+'">'+
    '<label>Nome</label><input id="or-nome" value="'+esc(o?o.nome:'')+'" placeholder="Ex.: Nubank Vinicius">'+
    '<div class="lin">'+
      '<div><label>Tipo</label><select id="or-tipo">'+
        ['cartao','conta','pix','dinheiro','outro'].map(t=>'<option'+(o&&o.tipo===t?' selected':'')+'>'+t+'</option>').join('')+
      '</select></div>'+
      '<div><label>Final / conta</label><input id="or-ident" value="'+esc(o?o.identificador:'')+'"></div>'+
    '</div>'+
    '<label>Titular</label><input id="or-titular" value="'+esc(o?o.titular:'')+'" placeholder="pode ser de familiar">'+
    '<label>Empresa padrão (opcional)</label><select id="or-empresa"><option value="">—</option>'+
      S.empresas.map(e=>'<option value="'+e.id+'"'+(o&&o.empresa_id===e.id?' selected':'')+'>'+esc(e.apelido||e.razao_social)+'</option>').join('')+
    '</select>'+
    '<div style="display:flex;gap:8px;margin-top:16px">'+
      '<button class="bt" onclick="salvarOrigem()">Salvar</button>'+

}
async function salvarOrigem(){
  const id = val('or-id'), nome = val('or-nome').trim();
  if(!nome) return aviso('Informe o nome da origem.','erro');
  const reg = { nome, tipo: val('or-tipo'), identificador: val('or-ident').trim()||null,
                titular: val('or-titular').trim()||null, empresa_id: val('or-empresa')||null };
  let res;
  if(id) res = await sb.from('origens').update(reg).eq('id',id).select().maybeSingle();
  else   res = await sb.from('origens').insert(reg).select().maybeSingle();
  if(res.error) return aviso('Não gravou: '+res.error.message,'erro');
  if(id){ const i=S.origens.findIndex(x=>x.id===id); if(i>=0) S.origens[i]=res.data; }
  else S.origens.push(res.data);
  S.modal=null; aviso('Origem salva.','ok');
}

}
function senhaSugerida(){ return 'cpe' + Math.random().toString(36).slice(2,8); }
async function chamarCriarUsuario(body){
  try{
    const { data, error } = await sb.functions.invoke('criar-usuario', { body });
    if(error){
      let msg = error.message || String(error);
      // o supabase-js esconde o corpo da resposta quando o status não é 2xx
      try{
        const j = await error.context.json();
        if(j && j.erro) msg = j.erro;
      }catch(e){
        try{ const t = await error.context.text(); if(t) msg = t.slice(0,300); }catch(e2){}
      }
      if(/non-2xx/i.test(msg)) msg += ' (veja Edge Functions > criar-usuario > Logs)';
      return { erro: msg };
    }
    if(data && data.erro) return { erro: data.erro };
    return data || {};
  }catch(e){ return { erro: 'Falha de rede ao chamar a função: '+(e.message||e) }; }
}

async function salvarUsuario(){
  const email = val('us-email').trim().toLowerCase();
  const senha = val('us-senha');
  if(!email.includes('@')) return aviso('E-mail inválido.','erro');
  if(senha.length<6) return aviso('A senha precisa de ao menos 6 caracteres.','erro');
  const empresas = Array.from(document.querySelectorAll('.us-emp')).filter(c=>c.checked).map(c=>c.value);
  const r = await chamarCriarUsuario({ acao:'criar', nome:val('us-nome').trim(), email, senha, papel:val('us-papel'), empresas });
  if(r.erro) return aviso('Não criou: '+r.erro,'erro');
  const { data:ps } = await sb.from('perfis').select('*').order('papel');
  S.perfis = ps||S.perfis;
  S.modal=null;
  aviso('Usuário criado. Senha: '+senha,'ok');
}
async function acaoUsuario(acao, id, extra){
  let body = { acao, id };
  if(acao==='senha'){
    const nova = prompt('Nova senha (mínimo 6 caracteres):', senhaSugerida());
    if(!nova) return; body.senha = nova;
  }
  if(acao==='ativar') body.ativo = extra;
  if(acao==='excluir' && !confirm('Excluir este usuário definitivamente?')) return;
  const r = await chamarCriarUsuario(body);
  if(r.erro) return aviso('Falhou: '+r.erro,'erro');
  const { data:ps } = await sb.from('perfis').select('*').order('papel');
  S.perfis = ps||S.perfis;
  aviso(acao==='senha'?'Senha trocada: '+body.senha : 'Feito.','ok');
}
